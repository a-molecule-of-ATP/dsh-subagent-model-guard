<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7a99" />
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0556a" />
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4cc38a" />
    </marker>
  </defs>

  <rect x="380" y="48" width="320" height="60" rx="14" fill="#1e2230" stroke="#2e3546" stroke-width="2" />
  <text x="540" y="85" text-anchor="middle" font-size="16" fill="#dfe4ee">subagent / subagent_fork</text>

  <!-- 1. 路由可判？ -->
  <line x1="540" y1="108" x2="540" y2="140" stroke="#6b7a99" stroke-width="2.5" marker-end="url(#a)" />
  <rect x="380" y="146" width="320" height="64" rx="14" fill="#1b2437" stroke="#2f4a6d" stroke-width="2" />
  <text x="540" y="174" text-anchor="middle" font-size="15" fill="#a9c2e6">provider / model 可判？</text>
  <text x="540" y="195" text-anchor="middle" font-size="12" fill="#6b7a99">两个都没给 = 继承父级</text>

  <path d="M 700 178 L 760 178" stroke="#6b7a99" stroke-width="2.5" marker-end="url(#a)" />
  <text x="730" y="168" text-anchor="middle" font-size="12" fill="#8b93a7">否</text>
  <rect x="766" y="150" width="420" height="56" rx="28" fill="#1b2437" stroke="#2f4a6d" stroke-width="2" />
  <text x="976" y="176" text-anchor="middle" font-size="13" fill="#a9c2e6">无法判定 → 放行 + 记录</text>
  <text x="976" y="194" text-anchor="middle" font-size="12" fill="#6b7a99">外部 acp / SDK 后端不触发 agent/created</text>

  <!-- 2. 官方名单 -->
  <line x1="540" y1="210" x2="540" y2="242" stroke="#6b7a99" stroke-width="2.5" marker-end="url(#a)" />
  <text x="556" y="232" font-size="12" fill="#8b93a7">是</text>
  <rect x="380" y="248" width="320" height="64" rx="14" fill="#1b2437" stroke="#2f4a6d" stroke-width="2" />
  <text x="540" y="276" text-anchor="middle" font-size="15" fill="#a9c2e6">在官方 allowedModels 里？</text>
  <text x="540" y="297" text-anchor="middle" font-size="12" fill="#6b7a99">每次派发实时读取</text>

  <path d="M 700 280 L 760 280" stroke="#e0556a" stroke-width="2.5" marker-end="url(#r)" />
  <text x="730" y="270" text-anchor="middle" font-size="12" fill="#f0909f">否</text>
  <rect x="766" y="254" width="300" height="52" rx="26" fill="#3a1f27" stroke="#e0556a" stroke-width="2" />
  <text x="916" y="286" text-anchor="middle" font-size="14" fill="#f0909f">拒绝（不在官方名单）</text>

  <!-- 3. 放行 -->
  <line x1="540" y1="312" x2="540" y2="344" stroke="#4cc38a" stroke-width="2.5" marker-end="url(#g)" />
  <text x="556" y="334" font-size="12" fill="#7fdba8">是</text>
  <rect x="380" y="350" width="320" height="56" rx="28" fill="#17301f" stroke="#4cc38a" stroke-width="2" />
  <text x="540" y="384" text-anchor="middle" font-size="15" fill="#7fdba8">放行</text>

  <!-- 说明 -->
  <rect x="80" y="440" width="1120" height="52" rx="26" fill="#1b2437" stroke="#2f4a6d" stroke-width="2" stroke-dasharray="5 6" />
  <text x="640" y="472" text-anchor="middle" font-size="13" fill="#a9c2e6">官方名单为空或服务不可用时不拦截；enforcement 只决定在哪里校验，不改变判定结果</text>

  <text x="360" y="180" text-anchor="end" font-size="12" fill="#4a5b7a">1</text>
  <text x="360" y="282" text-anchor="end" font-size="12" fill="#4a5b7a">2</text>
</svg>
